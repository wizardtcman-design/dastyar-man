name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          ATRIA_API_KEY: ${{ secrets.ATRIA_API_KEY }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        env:
          ATRIA_API_KEY: ${{ secrets.ATRIA_API_KEY }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/dastyar-man-debug.apk || true
          cp app/build/outputs/apk/release/*.apk out/dastyar-man-release.apk || true
          ls -la out

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-man-debug-apk
          path: out/dastyar-man-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-man-release-apk
          path: out/dastyar-man-release.apk
          if-no-files-found: error

      - name: Extract version
        id: ver
        run: echo "name=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: دستیار من v${{ steps.ver.outputs.name }}
          body: |
            نسخه اندرویدی «دستیار من» 🌱
            فایل APK را از بخش Assets دانلود و روی گوشی نصب کنید.
          files: |
            out/dastyar-man-debug.apk
            out/dastyar-man-release.apk
          draft: false
          prerelease: false
