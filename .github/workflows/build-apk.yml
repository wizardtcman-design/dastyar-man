name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/dastyar-man-debug.apk || true
          cp app/build/outputs/apk/release/*.apk out/dastyar-man-release.apk || true
          ls -la out

      - name: Verify APK signatures
        run: |
          for f in out/*.apk; do
            echo "--- $f"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$f" || exit 1
          done
          echo "==== signing fingerprint (must stay constant across builds) ===="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs out/dastyar-man-release.apk \
            | grep -i "SHA-256 digest" | head -1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-man-debug-apk
          path: out/dastyar-man-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-man-release-apk
          path: out/dastyar-man-release.apk
          if-no-files-found: error

      - name: Extract version
        id: ver
        run: echo "name=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          VERSION="1.0.${{ github.run_number }}"
          # Pull the section for this exact version from CHANGELOG.md.
          NOTES=$(awk -v ver="## $VERSION" '
            $0 == ver {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="- به‌روزرسانی نسخه و بهبود کلی برنامه."
          fi
          {
            echo "## 🌱 دستیار من — نسخه $VERSION"
            echo ""
            echo "$NOTES"
            echo ""
            echo "---"
            echo "### 📲 دانلود و نصب"
            echo "۱) فایل **dastyar-man-release.apk** را از بخش Assets همین صفحه دانلود کنید."
            echo "۲) اگر اندروید اجازه خواست، «نصب از منابع نامشخص» را فعال کنید."
            echo "۳) نصب کنید؛ نسخهٔ جدید روی نسخهٔ قبلی آپدیت می‌شود و اطلاعاتت پاک نمی‌شود."
            echo ""
            echo "[دانلود همیشگی آخرین نسخه](https://github.com/wizardtcman-design/dastyar-man/releases/latest)"
          } > /tmp/release_body.md
          echo "----- release body -----"
          cat /tmp/release_body.md

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: دستیار من v${{ steps.ver.outputs.name }}
          body_path: /tmp/release_body.md
          files: |
            out/dastyar-man-release.apk
          draft: false
          prerelease: false
          make_latest: true

      - name: Move the "latest" tag to this build
        run: |
          git tag -f latest
          git push -f origin latest
