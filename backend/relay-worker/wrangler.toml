# Cloudflare Worker configuration for the Dastyar relay.
# No secrets live in this file. Set them with `wrangler secret put` (see README).
#
# Replace `name` if you want a different worker name. The `*.workers.dev` host is
# created automatically on first deploy; if that host is blocked on the user's
# network, attach a Custom Domain on a domain you own (see the deploy guide).

name = "dastyar-relay"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Keep the worker in a single region-less model; no bindings are required.
# A KV namespace is optional and only needed if you later swap the in-memory
# rate limiter for a durable one. Left out on purpose for a minimal deploy.

[observability]
enabled = true
